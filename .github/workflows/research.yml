name: Semantic moderation validation
on:
  push:
    paths:
      - 'experiments/evaluate_moderation.py'
      - 'src/llm_safety_evaluator/moderation.py'
      - 'src/llm_safety_evaluator/evaluation.py'
      - 'src/llm_safety_evaluator/lexical.py'
      - 'src/llm_safety_evaluator/encoder.py'
      - 'experiments/render_report.py'
      - 'src/llm_safety_evaluator/uncertainty.py'
      - 'tests/**'
      - 'docs/dashboard.js'
      - 'requirements-research.txt'
      - '.github/workflows/research.yml'
  pull_request:
  workflow_dispatch:
concurrency:
  group: moderation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . numpy scikit-learn
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src experiments
      - run: node --check docs/dashboard.js
      - run: python tests/check_report.py docs/results/moderation.json
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/dashboard_smoke.cjs
  benchmark:
    needs: unit
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e . -r requirements-research.txt
      - run: python experiments/evaluate_moderation.py --limit 2000 --train-limit 30000
      - run: python tests/check_report.py results/moderation.json
      - run: python experiments/render_report.py results/moderation.json results/experimental-report.md
      - run: cp results/moderation.json docs/results/moderation.json
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/dashboard_smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: moderation-report
          path: |
            results/moderation.json
            results/experimental-report.md
      - name: Publish measured report
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/results
          cp results/moderation.json docs/results/moderation.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git diff --quiet "$GITHUB_SHA" origin/main -- experiments/evaluate_moderation.py experiments/render_report.py src/llm_safety_evaluator/moderation.py src/llm_safety_evaluator/evaluation.py src/llm_safety_evaluator/lexical.py src/llm_safety_evaluator/encoder.py src/llm_safety_evaluator/uncertainty.py requirements-research.txt; then
            echo "Superseded benchmark; retaining artifact only."
            exit 0
          fi
          git restore -- docs/results/moderation.json
          git checkout --detach origin/main
          cp results/moderation.json docs/results/moderation.json
          cp results/experimental-report.md docs/experimental-report.md
          git add -f -- docs/results/moderation.json docs/experimental-report.md
          git diff --cached --quiet && exit 0
          git commit -m "Publish measured benchmark report"
          git pull --rebase origin main
          git push origin HEAD:main
