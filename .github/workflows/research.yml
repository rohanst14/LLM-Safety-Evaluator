name: Semantic moderation validation
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: node --check docs/dashboard.js
  benchmark:
    needs: unit
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e . -r requirements-research.txt
      - run: python experiments/evaluate_moderation.py --limit 500
      - uses: actions/upload-artifact@v4
        with:
          name: moderation-report
          path: results/moderation.json
      - name: Publish measured report
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/results
          cp results/moderation.json docs/results/moderation.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/results/moderation.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish measured benchmark report"
          git push origin HEAD:main
