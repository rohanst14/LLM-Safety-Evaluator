name: Recover verified moderation report
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-report.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed schema-3 moderation run
        required: true
        default: '45758172050'
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: moderation-report
          run-id: ${{ inputs.run_id || '45758172050' }}
          github-token: ${{ github.token }}
          path: recovered
      - run: |
          python tests/check_report.py recovered/moderation.json
          python -c 'import json; r=json.load(open("recovered/moderation.json")); assert r["schema_version"]==3'
          python experiments/render_report.py recovered/moderation.json recovered/experimental-report.md
      - name: Publish verified result without replacing a newer benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach --force origin/main
            mkdir -p docs/results
            cp recovered/moderation.json docs/results/moderation-v3.json
            if python -c 'import json,sys; sys.exit(json.load(open("docs/results/moderation.json")).get("schema_version",1)>3)'; then
              cp recovered/moderation.json docs/results/moderation.json
              cp recovered/experimental-report.md docs/experimental-report.md
              git add -f -- docs/results/moderation.json docs/experimental-report.md
            fi
            git add -f -- docs/results/moderation-v3.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Restore verified schema-3 benchmark from completed workflow"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
